[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
linker = "rust-lld"

# Do not pin a default target here. A forced Windows MSVC target
# breaks Linux, macOS, Docker, and GitHub Actions runners.
# Cross-compile Windows from those hosts with:
#   cargo build --release --target x86_64-pc-windows-msvc

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
debug = false
