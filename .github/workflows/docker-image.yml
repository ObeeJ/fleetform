name: Docker Image CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build CLI image
        run: docker build . --file Dockerfile --tag fleetform-cli:${{ github.sha }}
      - name: Build web image
        run: docker build ./fiber --file fiber/Dockerfile --tag fleetform-web:${{ github.sha }}
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push images to GHCR
        if: github.event_name == 'push'
        run: |
          CLI=ghcr.io/${{ github.repository_owner }}/fleetform-cli
          WEB=ghcr.io/${{ github.repository_owner }}/fleetform-web
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          CLI=ghcr.io/${OWNER}/fleetform-cli
          WEB=ghcr.io/${OWNER}/fleetform-web
          docker tag fleetform-cli:${{ github.sha }} $CLI:${{ github.sha }}
          docker tag fleetform-cli:${{ github.sha }} $CLI:latest
          docker tag fleetform-web:${{ github.sha }} $WEB:${{ github.sha }}
          docker tag fleetform-web:${{ github.sha }} $WEB:latest
          docker push $CLI:${{ github.sha }}
          docker push $CLI:latest
          docker push $WEB:${{ github.sha }}
          docker push $WEB:latest
